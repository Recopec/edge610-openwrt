name: Build Edge 610 OpenWrt Image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: 准备宿主编译依赖与工具链伪装
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev zlib1g-dev gawk git gettext libssl-dev rsync wget unzip python3 jq zstd xz-utils which debianutils

          # 建立通用 sha256 与 md5 兼容包装，确保索引脚本 100% 能够获取哈希值
          sudo tee /usr/local/bin/sha256 > /dev/null << 'EOF'
          #!/bin/sh
          sha256sum "$1" | awk '{print $1}'
          EOF
          sudo chmod +x /usr/local/bin/sha256

          sudo tee /usr/local/bin/md5 > /dev/null << 'EOF'
          #!/bin/sh
          md5sum "$1" | awk '{print $1}'
          EOF
          sudo chmod +x /usr/local/bin/md5

          # 包装 install 命令，绕过 OpenWrt 的 "install --version | grep GNU" 检查
          sudo tee /usr/local/bin/install > /dev/null << 'EOF'
          #!/bin/sh
          if [ "$1" = "--version" ]; then
              echo "install (GNU coreutils) 9.4"
              exit 0
          fi
          exec /usr/bin/install "$@"
          EOF
          sudo chmod +x /usr/local/bin/install

      - name: 下载并解压 ImageBuilder
        run: |
          VERSION="23.05.5"
          echo "Using OpenWrt version: $VERSION"

          IB_FILE=$(curl -sL "https://downloads.openwrt.org/releases/${VERSION}/targets/x86/64/" | grep -oE "openwrt-imagebuilder-${VERSION}-x86-64\.Linux-x86_64\.tar\.(xz|zst)" | head -n 1)
          [ -z "$IB_FILE" ] && IB_FILE="openwrt-imagebuilder-23.05.5-x86-64.Linux-x86_64.tar.xz"
          echo "Downloading: $IB_FILE"

          curl -fL -o ib-archive "https://downloads.openwrt.org/releases/${VERSION}/targets/x86/64/${IB_FILE}"
          mkdir -p imagebuilder
          tar -xf ib-archive -C imagebuilder --strip-components=1
          rm -f ib-archive

      - name: 抓取 OpenClash 与 Mihomo amd64-v1 内核
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd imagebuilder
          mkdir -p packages files/etc/openclash/core files/etc

          # 1. 下载 OpenClash 最新稳定 release ipk
          CLASH_IPK_URL=$(curl -sL -H "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/repos/vernesong/OpenClash/releases/latest | jq -r '.assets[] | select(.name | endswith(".ipk") and contains("all")) | .browser_download_url' | head -n 1)
          [ -z "$CLASH_IPK_URL" ] && CLASH_IPK_URL="https://github.com/vernesong/OpenClash/releases/download/v0.48.002/luci-app-openclash_0.48.002_all.ipk"
          echo "Downloading OpenClash from: $CLASH_IPK_URL"
          curl -sL -o packages/luci-app-openclash.ipk "$CLASH_IPK_URL"

          # 2. 下载适配 Atom C3338 的最新版 Mihomo (amd64-v1)
          CORE_URL=$(curl -sL -H "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | jq -r '.assets[] | select(.name | contains("linux-amd64-v1") and (endswith(".gz"))) | .browser_download_url' | head -n 1)
          [ -z "$CORE_URL" ] && CORE_URL="https://github.com/MetaCubeX/mihomo/releases/download/v1.19.33/mihomo-linux-amd64-v1-go120-v1.19.33.gz"
          echo "Downloading Mihomo Core from: $CORE_URL"
          curl -sL -o mihomo.gz "$CORE_URL"
          gzip -d mihomo.gz
          mv mihomo files/etc/openclash/core/clash_meta
          chmod +x files/etc/openclash/core/clash_meta

          # 3. 预置关停硬件看门狗的开机自启脚本
          cat << 'EOF' > files/etc/rc.local
          i2cset -y 0 0x22 0 0 b 2>/dev/null || true
          i2cset -y 0 0x24 0x0 0x0 b 2>/dev/null || true
          i2cset -y 1 0x22 0 0 b 2>/dev/null || true
          i2cset -y 1 0x24 0x0 0x0 b 2>/dev/null || true
          exit 0
          EOF
          chmod +x files/etc/rc.local

      - name: 配置本地仓库源并生成索引
        run: |
          cd imagebuilder
          # 允许安装未签名第三方 ipk
          sed -i 's/option check_signature/# option check_signature/' repositories.conf
          # 注册本地 packages 目录
          echo "src custom file:$PWD/packages" >> repositories.conf
          # 预生成密钥，避免 make package_index 调用 usign 时报错
          ./staging_dir/host/bin/usign -G -s key-build -p key-build.pub
          make package_index

      - name: 生成 Edge 610 定制镜像
        run: |
          cd imagebuilder
          # 扩容根分区至 1024MB，确保能容纳 50MB+ 的 Mihomo 内核与依赖
          sed -i 's/CONFIG_TARGET_ROOTFS_PARTSIZE=.*/CONFIG_TARGET_ROOTFS_PARTSIZE=1024/' .config || true

          # 加 FORCE=1 确保绕过主机预检拦截
          make image \
            FORCE=1 \
            PROFILE="generic" \
            ROOTFS_PARTSIZE=1024 \
            PACKAGES="kmod-switch-mv88e6xxx kmod-ixgbe kmod-i2c-core kmod-i2c-i801 kmod-i2c-smbus i2c-tools \
                      luci luci-app-openclash -dnsmasq dnsmasq-full \
                      kmod-nft-tproxy ip-full ca-certificates ca-bundle bash curl coreutils coreutils-nohup ipset kmod-tun" \
            FILES="files"

      - name: 发布镜像构件
        uses: actions/upload-artifact@v4
        with:
          name: Edge610-OpenWrt-Image
          path: imagebuilder/bin/targets/x86/64/*-generic-ext4-combined-efi.img.gz
          if-no-files-found: error

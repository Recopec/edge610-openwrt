name: Build Edge 610 OpenWrt Image

on:
  workflow_dispatch:

concurrency:
  group: edge610-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout build definition
        uses: actions/checkout@v4

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev libelf-dev libxml2-utils \
            python3 python3-setuptools rsync unzip zlib1g-dev file wget \
            time zip xz-utils zstd which debianutils jq fdisk e2fsprogs
          # Handoff-validated shims: harmless on GNU userland, kept as belt
          # and suspenders for the OpenWrt host prechecks (install/sha256/md5).
          sudo tee /usr/local/bin/sha256 >/dev/null <<'EOF'
          #!/bin/sh
          sha256sum "$1" | awk '{print $1}'
          EOF
          sudo chmod +x /usr/local/bin/sha256
          sudo tee /usr/local/bin/md5 >/dev/null <<'EOF'
          #!/bin/sh
          md5sum "$1" | awk '{print $1}'
          EOF
          sudo chmod +x /usr/local/bin/md5
          sudo tee /usr/local/bin/install >/dev/null <<'EOF'
          #!/bin/sh
          if [ "$1" = "--version" ]; then
            echo "install (GNU coreutils) 9.4"
            exit 0
          fi
          exec /usr/bin/install "$@"
          EOF
          sudo chmod +x /usr/local/bin/install

      - name: Verify eMMC auto-expand script on a loop device
        run: |
          # Reproduce the flashed layout (128 MiB EFI + 1 GiB rootfs) on a
          # 4 GiB sparse file and check that the first-boot script grows the
          # root filesystem in place, keeps the start sector and is idempotent.
          sudo truncate -s 4G /tmp/disk.img
          sudo sfdisk /tmp/disk.img >/dev/null <<'EOF'
          label: dos
          ,128M,c
          ,1G,83
          EOF
          LOOP="$(sudo losetup -fP --show /tmp/disk.img)"
          sudo mkfs.ext4 -q "${LOOP}p2"
          PART_SYS="/sys/class/block/$(basename "${LOOP}p2")"
          blocks() { sudo dumpe2fs -h "${LOOP}p2" 2>/dev/null | awk -F: '/^Block count/{gsub(/ /,"",$2); print $2}'; }
          before="$(blocks)"; start_before="$(cat "$PART_SYS/start")"
          sudo sh package/edge610-board/files/etc/uci-defaults/zzz98-edge610-resize "$LOOP"
          after="$(blocks)"; start_after="$(cat "$PART_SYS/start")"
          echo "blocks ${before} -> ${after}, start ${start_before} -> ${start_after}"
          [ "$start_before" = "$start_after" ] || { echo "::error::partition start moved"; exit 1; }
          [ "$after" -gt "$((before * 2))" ] || { echo "::error::filesystem did not grow"; exit 1; }
          sudo sh package/edge610-board/files/etc/uci-defaults/zzz98-edge610-resize "$LOOP"
          [ "$(blocks)" = "$after" ] || { echo "::error::second run changed the filesystem"; exit 1; }
          sudo losetup -d "$LOOP"
          echo "auto-expand OK: $((before * 4 / 1024)) MiB -> $((after * 4 / 1024)) MiB"

      - name: Free disk space
        run: |
          sudo rm -rf /opt/hostedtoolcache /opt/ghc /usr/local/lib/android \
            /usr/share/dotnet /usr/local/.ghcup || true
          df -h /

      - name: Clone OpenWrt v25.12.6 and add Edge 610 board package
        run: |
          git clone --depth 1 --branch v25.12.6 \
            https://github.com/openwrt/openwrt.git openwrt
          cp -r package/edge610-board openwrt/package/
          test -f openwrt/package/edge610-board/Makefile

      - name: Cache source downloads
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: dl-25.12.6-v1
          restore-keys: |
            dl-25.12.6-

      - name: Configure feeds (official pinned commits + OpenClash)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd openwrt
          # Official feed pins for this release, minus the redundant "base"
          # line (that would clone the OpenWrt tree a second time).
          curl -fsSL -o feeds.conf \
            https://downloads.openwrt.org/releases/25.12.6/packages/x86_64/feeds.conf
          sed -i '/^src-git base /d' feeds.conf
          # OpenClash: latest stable release tag, master as fallback.
          OC_TAG="$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" \
            https://api.github.com/repos/vernesong/OpenClash/releases/latest \
            | jq -r '.tag_name // empty')"
          [ -n "$OC_TAG" ] || OC_TAG=master
          echo "src-git openclash https://github.com/vernesong/OpenClash.git;${OC_TAG}" >> feeds.conf
          echo "--- feeds.conf ---"
          cat feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Build po2lmo host tool (needed by OpenClash translation build)
        run: |
          cd openwrt
          make -C package/feeds/luci/luci-base/src po2lmo
          mkdir -p staging_dir/host/bin
          cp package/feeds/luci/luci-base/src/po2lmo staging_dir/host/bin/po2lmo
          staging_dir/host/bin/po2lmo 2>&1 | head -n 3 || true

      - name: Download Mihomo core (linux-amd64-v1, no AVX2) into package files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd openwrt/package/edge610-board/files
          mkdir -p etc/openclash/core
          CORE_URL="$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | jq -r '.assets[] | select(.name | contains("linux-amd64-v1") and (endswith(".gz"))) | .browser_download_url' | head -n 1)"
          [ -n "$CORE_URL" ] || CORE_URL="https://github.com/MetaCubeX/mihomo/releases/download/v1.19.33/mihomo-linux-amd64-v1-go120-v1.19.33.gz"
          echo "Downloading Mihomo core from: $CORE_URL"
          # The Atom C3338 has no AVX2: the asset MUST be the v1 build.
          echo "$CORE_URL" | grep -q "linux-amd64-v1"
          curl -fL -o /tmp/mihomo.gz "$CORE_URL"
          gzip -dc /tmp/mihomo.gz > etc/openclash/core/clash_meta
          chmod 755 etc/openclash/core/clash_meta
          file etc/openclash/core/clash_meta | grep -q "ELF 64-bit"
          ./etc/openclash/core/clash_meta -v
          ./etc/openclash/core/clash_meta -v | grep -qi mihomo

      - name: Generate .config and verify package selection
        run: |
          cd openwrt
          cat > .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_MULTI_PROFILE=y
          CONFIG_TARGET_DEVICE_x86_64_DEVICE_generic=y
          CONFIG_TARGET_ROOTFS_PARTSIZE=1024
          CONFIG_TARGET_ROOTFS_EXT4FS=y
          CONFIG_GRUB_IMAGES=y
          CONFIG_GRUB_EFI_IMAGES=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_edge610-board=y
          CONFIG_PACKAGE_kmod-edge610-switch=y
          CONFIG_PACKAGE_kmod-edge610-dsa=y
          CONFIG_PACKAGE_kmod-i2c-ismt=y
          CONFIG_PACKAGE_kmod-dsa=y
          CONFIG_PACKAGE_kmod-dsa-mv88e6xxx=y
          CONFIG_PACKAGE_kmod-ixgbe=y
          CONFIG_PACKAGE_i2c-tools=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_coreutils=y
          CONFIG_PACKAGE_coreutils-nohup=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_ca-certificates=y
          CONFIG_PACKAGE_dnsmasq-full=y
          # CONFIG_PACKAGE_dnsmasq is not set
          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_luci-app-package-manager=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-app-statistics=y
          CONFIG_PACKAGE_luci-app-ddns=y
          CONFIG_PACKAGE_luci-app-sqm=y
          CONFIG_PACKAGE_luci-proto-wireguard=y
          CONFIG_PACKAGE_luci-proto-ipv6=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-package-manager-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-ttyd-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-statistics-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-ddns-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-sqm-zh-cn=y
          CONFIG_PACKAGE_ethtool=y
          CONFIG_PACKAGE_tcpdump=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_mtr=y
          CONFIG_PACKAGE_iperf3=y
          CONFIG_PACKAGE_iftop=y
          CONFIG_PACKAGE_bind-host=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_pciutils=y
          CONFIG_PACKAGE_usbutils=y
          CONFIG_PACKAGE_lm-sensors=y
          CONFIG_PACKAGE_kmod-hwmon-coretemp=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_kmod-usb-net-rtl8152=y
          CONFIG_PACKAGE_kmod-usb-net-asix-ax88179=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          EOF
          make defconfig
          for sym in \
            CONFIG_TARGET_x86_64=y \
            CONFIG_TARGET_ROOTFS_PARTSIZE=1024 \
            CONFIG_PACKAGE_edge610-board=y \
            CONFIG_PACKAGE_kmod-edge610-switch=y \
            CONFIG_PACKAGE_kmod-edge610-dsa=y \
            CONFIG_PACKAGE_kmod-i2c-ismt=y \
            CONFIG_PACKAGE_kmod-dsa-mv88e6xxx=y \
            CONFIG_PACKAGE_kmod-ixgbe=y \
            CONFIG_PACKAGE_luci-app-openclash=y \
            CONFIG_PACKAGE_i2c-tools=y \
            CONFIG_PACKAGE_ip-full=y \
            CONFIG_PACKAGE_dnsmasq-full=y \
            CONFIG_PACKAGE_luci-app-ttyd=y \
            CONFIG_PACKAGE_luci-app-package-manager=y \
            CONFIG_PACKAGE_luci-proto-wireguard=y \
            CONFIG_PACKAGE_ethtool=y \
            CONFIG_PACKAGE_iperf3=y \
            CONFIG_PACKAGE_kmod-hwmon-coretemp=y \
            CONFIG_PACKAGE_sfdisk=y \
            CONFIG_PACKAGE_resize2fs=y; do
            grep -q "^${sym}$" .config || { echo "MISSING after defconfig: $sym"; exit 1; }
          done
          grep -q '^# CONFIG_PACKAGE_dnsmasq is not set' .config || { echo "plain dnsmasq still enabled"; exit 1; }
          echo "defconfig OK"

      - name: Remove ixgbe autoload (probe order owned by /etc/init.d/edge610)
        run: |
          cd openwrt
          MK=package/kernel/linux/modules/netdevices.mk
          grep -q 'AutoLoad,35,ixgbe)' "$MK" || { echo "expected AutoLoad line not found - upstream changed"; exit 1; }
          sed -i '/AutoLoad,35,ixgbe)/d' "$MK"
          ! grep -q 'AutoLoad,35,ixgbe)' "$MK" || { echo "sed failed to remove ixgbe autoload"; exit 1; }
          grep -q 'AutoLoad,35,ixgbevf)' "$MK" || { echo "unrelated ixgbevf line was damaged"; exit 1; }
          echo "ixgbe autoload removed; probe order now: edge610 init script"

      - name: Download all sources (bounded)
        run: |
          cd openwrt
          if ! timeout 1800 make download -j"$(nproc)" > dl.log 2>&1; then
            echo "::error::make download failed or timed out - last 100 lines:"
            tail -n 100 dl.log
            exit 1
          fi
          tail -n 5 dl.log

      - name: Build image (full source build)
        run: |
          cd openwrt
          make -j"$(nproc)" > build.log 2>&1 &
          MPID=$!
          while kill -0 $MPID 2>/dev/null; do
            echo "$(date -u +%H:%M:%S) | load: $(cut -d' ' -f1-3 /proc/loadavg) | $(tail -n 1 build.log | tr -d '\r' | cut -c1-180)"
            sleep 60
          done
          if ! wait $MPID; then
            echo "::error::make failed - last 400 lines of build.log:"
            tail -n 400 build.log
            exit 1
          fi
          tail -n 20 build.log

      - name: Verify image and rootfs contents
        run: |
          cd openwrt
          IMG="$(ls bin/targets/x86/64/*-generic-ext4-combined-efi.img.gz 2>/dev/null | head -n1)"
          [ -n "$IMG" ] || { echo "EFI combined image missing:"; ls -la bin/targets/x86/64/; exit 1; }
          [ "$(stat -c%s "$IMG")" -gt 50000000 ] || { echo "image suspiciously small: $IMG"; exit 1; }
          ls -la bin/targets/x86/64/

          # Package manifest: every selected package must be installed.
          MAN=bin/targets/x86/64/openwrt-x86-64.manifest
          [ -f "$MAN" ] || { echo "manifest missing"; exit 1; }
          for p in luci-app-openclash i2c-tools ip-full dnsmasq-full \
                   kmod-edge610-switch kmod-edge610-dsa kmod-i2c-ismt \
                   kmod-dsa-mv88e6xxx kmod-ixgbe kmod-hwmon-coretemp \
                   sfdisk partx-utils resize2fs; do
            grep -q "^$p " "$MAN" || { echo "manifest missing package: $p"; exit 1; }
          done

          # Modules must be in the rootfs staging tree (directory name varies).
          for m in edge610_switch_standalone edge610_dsa i2c-ismt mv88e6xxx ixgbe; do
            find build_dir -path '*/lib/modules/*' -name "$m.ko" | grep -q . || { echo "rootfs module missing: $m.ko"; exit 1; }
          done
          find build_dir -path '*/lib/modules/*' -name 'dsa*.ko' | grep -q . || { echo "dsa core module missing"; exit 1; }

          # File-level checks via the rootfs tarball (path-independent).
          TAR=bin/targets/x86/64/openwrt-x86-64-rootfs.tar.gz
          [ -f "$TAR" ] || { echo "rootfs tarball missing"; exit 1; }
          tar -tzf "$TAR" | sed 's|^\./||' > /tmp/rootfs-files.txt
          for f in etc/init.d/edge610 etc/modprobe.d/edge610.conf \
                   etc/uci-defaults/zzz99-edge610-network \
                   etc/uci-defaults/zzz98-edge610-resize \
                   etc/openclash/core/clash_meta; do
            grep -qx "$f" /tmp/rootfs-files.txt || { echo "rootfs missing: $f"; exit 1; }
          done
          grep -qE '/i2cset$' /tmp/rootfs-files.txt || { echo "i2cset missing"; exit 1; }
          grep -qE '/sfdisk$' /tmp/rootfs-files.txt || { echo "sfdisk missing"; exit 1; }
          grep -qE '/partx$' /tmp/rootfs-files.txt || { echo "partx missing"; exit 1; }
          grep -qE '/resize2fs$' /tmp/rootfs-files.txt || { echo "resize2fs missing"; exit 1; }

          # Extract and run the binaries actually shipped in the image.
          rm -rf /tmp/rootcheck && mkdir -p /tmp/rootcheck
          tar -xzf "$TAR" -C /tmp/rootcheck
          file /tmp/rootcheck/etc/openclash/core/clash_meta | grep -q "ELF 64-bit" || { echo "clash_meta not ELF64"; exit 1; }
          /tmp/rootcheck/etc/openclash/core/clash_meta -v | tee /tmp/core-v.txt
          grep -qi mihomo /tmp/core-v.txt || { echo "clash_meta does not report Mihomo"; exit 1; }
          grep -q "lan6" /tmp/rootcheck/etc/uci-defaults/zzz99-edge610-network || { echo "network defaults do not reference lan6"; exit 1; }
          grep -q "config interface 'wan'" /tmp/rootcheck/etc/uci-defaults/zzz99-edge610-network || { echo "SFP WAN interface missing"; exit 1; }
          grep -q "option device 'eth2'" /tmp/rootcheck/etc/uci-defaults/zzz99-edge610-network || { echo "WAN is not wired to eth2 (SFP1)"; exit 1; }
          ! grep -qE "^config [a-z]+ '" /tmp/rootcheck/etc/uci-defaults/zzz99-edge610-network || { echo "uci section names must be anonymous (no quotes)"; exit 1; }

          # DSA port rename baked into the compiled module.
          KO="$(find build_dir -path '*/lib/modules/*' -name edge610_dsa.ko | head -n1)"
          [ -n "$KO" ] || KO="$(find build_dir -name edge610_dsa.ko | head -n1)"
          [ -n "$KO" ] || { echo "edge610_dsa.ko not found"; exit 1; }
          strings "$KO" | grep -q 'lan6' || { echo "DSA port rename not in module"; exit 1; }

          # Kernel config is belt-and-suspenders (module presence above is the proof).
          KCFG="$(find build_dir -maxdepth 5 -name '.config' -path '*linux*' | head -n1)"
          if [ -n "$KCFG" ]; then
            for k in CONFIG_NET_DSA CONFIG_NET_DSA_MV88E6XXX CONFIG_IXGBE CONFIG_I2C_ISMT; do
              grep -qE "^${k}=[ym]" "$KCFG" || echo "::warning::kernel config missing $k ($KCFG)"
            done
          else
            echo "::warning::kernel .config not located; relying on module presence checks"
          fi
          echo "verification OK"

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: Edge610-OpenWrt-Image
          path: |
            openwrt/bin/targets/x86/64/*-generic-ext4-combined-efi.img.gz
            openwrt/bin/targets/x86/64/*.manifest
            openwrt/bin/targets/x86/64/sha256sums
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            openwrt/build.log
            openwrt/dl.log
          if-no-files-found: ignore

name: Build Edge 610 OpenWrt Image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: 准备宿主编译依赖与环境修复
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev zlib1g-dev gawk git gettext libssl-dev rsync wget unzip python3 jq zstd xz-utils which debianutils

          # 1. 注入 sha256 与 md5 兼容包装
          sudo tee /usr/local/bin/sha256 > /dev/null << 'EOF'
          #!/bin/sh
          sha256sum "$1" | awk '{print $1}'
          EOF
          sudo chmod +x /usr/local/bin/sha256

          sudo tee /usr/local/bin/md5 > /dev/null << 'EOF'
          #!/bin/sh
          md5sum "$1" | awk '{print $1}'
          EOF
          sudo chmod +x /usr/local/bin/md5

          # 2. 包装 install 命令，确保通过 OpenWrt 的 "install --version | grep GNU" 检查
          sudo tee /usr/local/bin/install > /dev/null << 'EOF'
          #!/bin/sh
          if [ "$1" = "--version" ]; then
              echo "install (GNU coreutils) 9.4"
              exit 0
          fi
          exec /usr/bin/install "$@"
          EOF
          sudo chmod +x /usr/local/bin/install

      - name: 下载并解压 ImageBuilder
        run: |
          VERSION="23.05.5"
          echo "Using OpenWrt version: $VERSION"

          IB_FILE=$(curl -sL "https://downloads.openwrt.org/releases/${VERSION}/targets/x86/64/" \vert{} grep -oE "openwrt-imagebuilder-${VERSION}-x86-64\.Linux-x86_64\.tar\.(xz|zst)" | head -n 1)
          [ -z "$IB_FILE" ] && IB_FILE="openwrt-imagebuilder-23.05.5-x86-64.Linux-x86_64.tar.xz"
          echo "Downloading: $IB_FILE"

          curl -fL -o ib-archive "https://downloads.openwrt.org/releases/${VERSION}/targets/x86/64/${IB_FILE}"
          mkdir -p imagebuilder
          tar -xf ib-archive -C imagebuilder --strip-components=1
          rm -f ib-archive

      - name: 抓取 OpenClash 与 Mihomo amd64-v1 内核
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd imagebuilder
          mkdir -p packages files/etc/openclash/core files/etc

          # 1. 下载 OpenClash ipk
          CLASH_IPK_URL=$(curl -sL -H "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/repos/vernesong/OpenClash/releases/latest | jq -r '.assets[] | select(.name | endswith(".ipk") and contains("all")) | .browser_download_url' | head -n 1)
          [ -z "$CLASH_IPK_URL" ] && CLASH_IPK_URL="https://github.com/vernesong/OpenClash/releases/download/v0.48.002/luci-app-openclash_0.48.002_all.ipk"
          echo "Downloading OpenClash from: $CLASH_IPK_URL"
          curl -sL -o packages/luci-app-openclash.ipk "$CLASH_IPK_URL"

          # 2. 下载适配 Atom C3338 的 Mihomo amd64-v1 内核
          CORE_URL=$(curl -sL -H "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | jq -r '.assets[] | select(.name | contains("linux-amd64-v1") and (endswith(".gz"))) | .browser_download_url' | head -n 1)
          [ -z "$CORE_URL" ] && CORE_URL="https://github.com/MetaCubeX/mihomo/releases/download/v1.19.33/mihomo-linux-amd64-v1-go120-v1.19.33.gz"
          echo "Downloading Mihomo Core from: $CORE_URL"

# Edge 610 board parameters (CVMagic-validated values).
# /etc/init.d/edge610 passes these explicitly on the modprobe command line
# before ixgbe; this file covers manual modprobe invocations too.
options edge610_switch_standalone cpu_port=10 x553_sgmii=1 cpu_mac_ctl=0x203e serdes_autoneg=1
options edge610_dsa force_cpu_phyctl=0x203e
# The Edge 610 watchdog is disabled via i2c-ismt; keep the PCH TCO driver
# away from it (CVMagic parity, harmless if the module is absent).
blacklist iTCO_wdt

<%+header%>

<h2 name="content"><%:Modem%></h2>

<div class="cbi-section">
	<div class="md-toolbar">
		<label for="md-interval"><%:Auto refresh%>:</label>
		<select id="md-interval" class="cbi-input-select">
			<option value="0"><%:Disabled%></option>
			<option value="5">5s</option>
			<option value="10" selected>10s</option>
			<option value="30">30s</option>
			<option value="60">60s</option>
		</select>
		<button id="md-refresh" class="btn cbi-button cbi-button-action"><%:Refresh%></button>
		<span id="md-state" class="md-muted"><%:Loading…%></span>
	</div>
</div>

<div id="md-grid" class="md-grid">
	<div class="md-card"><h3><%:Connection%></h3><div class="md-skel"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div></div>
	<div class="md-card"><h3><%:Signal%></h3><div class="md-skel"><span></span><span></span><span></span><span></span><span></span><span></span></div></div>
	<div class="md-card"><h3><%:Cell%></h3><div class="md-skel"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div></div>
	<div class="md-card"><h3><%:Hardware%></h3><div class="md-skel"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div></div>
	<div class="md-card"><h3><%:Neighbour cells%></h3><div class="md-skel"><span></span><span></span><span></span><span></span></div></div>
</div>

<style>
.md-toolbar{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.md-muted{color:#888;font-size:.85rem}
.md-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:1rem;margin-top:1rem}
.md-card{background:#fff;border:1px solid #e3e3e3;border-radius:8px;padding:1rem 1.1rem;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.md-card h3{margin:0 0 .7rem;font-size:.95rem;font-weight:600;color:#444;border-bottom:1px solid #eee;padding-bottom:.5rem}
.md-table{width:100%;border-collapse:collapse;font-size:.88rem}
.md-table td{padding:.22rem 0;vertical-align:top}
.md-table th{font-size:.78rem;color:#888;text-align:right;font-weight:500;padding:.2rem 0}
.md-table th:first-child{text-align:left}
.md-l{color:#777;white-space:nowrap;padding-right:1rem}
.md-v{text-align:right;font-weight:600;word-break:break-all}
.md-bar{height:7px;background:#eee;border-radius:4px;overflow:hidden;margin:.2rem 0 .1rem}
.md-bar>span{display:block;height:100%;border-radius:4px;background:#4caf50}
.md-row{margin:.45rem 0}
.md-row .md-sub{font-size:.78rem;color:#888}
.md-tag{display:inline-block;padding:.05rem .45rem;border-radius:10px;font-size:.78rem;background:#eef4ff;color:#2867c9}
.md-tag.ok{background:#e8f5e9;color:#2e7d32}
.md-tag.warn{background:#fff8e1;color:#b26a00}
.md-tag.err{background:#fdecea;color:#c62828}
.md-neigh td{text-align:right;padding:.2rem 0;font-variant-numeric:tabular-nums}
.md-neigh td:first-child{text-align:left}
.md-neigh tr.md-serv td{font-weight:600}
.md-skel span{display:block;height:10px;border-radius:5px;background:#eceff3;margin:.6rem 0;animation:mdpulse 1.2s ease-in-out infinite}
.md-skel span:nth-child(odd){width:60%}
.md-skel span:nth-child(even){width:85%}
@keyframes mdpulse{0%,100%{opacity:.55}50%{opacity:1}}
</style>

<script>
(function() {
	var URL = '<%=luci.dispatcher.build_url("admin", "status", "modem", "data")%>';
	var L = {
		conn: '<%:Connection%>',
		signal: '<%:Signal%>',
		cell: '<%:Cell%>',
		hardware: '<%:Hardware%>',
		neigh: '<%:Neighbour cells%>',
		operator: '<%:Operator%>',
		plmn: '<%:PLMN%>',
		mode: '<%:Technology%>',
		reg: '<%:Registration%>',
		sim: '<%:SIM%>',
		ps: 'PS',
		emm: 'EMM',
		rrc: 'RRC',
		band: '<%:Band%>',
		bw: '<%:Bandwidth%>',
		pci: 'PCI',
		earfcn: 'EARFCN',
		tac: 'TAC',
		eci: 'ECI',
		scc: 'SCC',
		model: '<%:Model%>',
		fw: '<%:Firmware%>',
		imei: 'IMEI',
		imsi: 'IMSI',
		iccid: 'ICCID',
		temp: '<%:Temperature%>',
		uptime: '<%:Uptime%>',
		resets: '<%:Resets%>',
		csq: 'CSQ',
		rsrp: 'RSRP',
		rsrq: 'RSRQ',
		sinr: 'SINR',
		rssi: 'RSSI',
		txpower: '<%:Tx power%>',
		serving: '<%:serving%>',
		unreg: '<%:Not registered%>',
		searching: '<%:Searching%>',
		registered: '<%:Registered%>',
		offline: '<%:AT port not found%>',
		excellent: '<%:Excellent%>',
		good: '<%:Good%>',
		fair: '<%:Fair%>',
		poor: '<%:Poor%>'
	};

	function esc(s) {
		return String(s == null || s === '' ? '-' : s).replace(/[&<>"]/g, function(c) {
			return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c];
		});
	}

	function row(label, value, cls) {
		return '<tr><td class="md-l">' + label + '</td><td class="md-v ' + (cls || '') + '">' + value + '</td></tr>';
	}

	function card(title, rows) {
		return '<div class="md-card"><h3>' + title + '</h3><table class="md-table">' + rows + '</table></div>';
	}

	function qual(v, levels) {
		if (v == null) return null;
		for (var i = 0; i < levels.length; i++) {
			if (v >= levels[i][0]) return levels[i];
		}
		return levels[levels.length - 1];
	}

	function bar(label, value, unit, pct, q) {
		var color = q ? q[2] : '#4caf50';
		return '<div class="md-row"><div>' + label + ': <b>' + esc(value) + (value == null ? '' : ' ' + unit) +
			'</b>' + (q ? ' <span class="md-sub">' + q[1] + '</span>' : '') + '</div>' +
			'<div class="md-bar"><span style="width:' + (pct == null ? 0 : Math.max(0, Math.min(100, pct))) +
			'%;background:' + color + '"></span></div></div>';
	}

	function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

	function arr(v) { return Array.isArray(v) ? v : []; }

	function fmtUptime(s) {
		if (s == null) return null;
		var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
		return (h > 0 ? h + 'h ' : '') + m + 'm';
	}

	function neighCard(d) {
		var serving = d.cell && d.cell.pci;
		var intra = arr(d.neigh && d.neigh.intra);
		var inter = arr(d.neigh && d.neigh.inter);
		var h = '<table class="md-table md-neigh"><thead><tr><th>PCI</th><th>RSRP</th><th>RSRQ</th><th>RSSI</th></tr></thead><tbody>';
		intra.forEach(function(n) {
			h += '<tr' + (n.pci === serving ? ' class="md-serv"' : '') + '><td>' + esc(n.pci) +
				(n.pci === serving ? ' <span class="md-tag ok">' + L.serving + '</span>' : '') +
				'</td><td>' + esc(n.rsrp) + '</td><td>' + esc(n.rsrq) + '</td><td>' + esc(n.rssi) + '</td></tr>';
		});
		h += '</tbody></table>';
		if (inter.length) {
			h += '<table class="md-table md-neigh" style="margin-top:.6rem"><thead><tr><th>EARFCN</th><th>PCI</th><th>RSRP</th><th>RSRQ</th></tr></thead><tbody>';
			inter.forEach(function(n) {
				h += '<tr><td>' + esc(n.earfcn) + '</td><td>' + esc(n.pci) + '</td><td>' + esc(n.rsrp) + '</td><td>' + esc(n.rsrq) + '</td></tr>';
			});
			h += '</tbody></table>';
		}
		if (!intra.length && !inter.length) {
			h += '<div class="md-muted">-</div>';
		}
		return '<div class="md-card"><h3>' + L.neigh + '</h3>' + h + '</div>';
	}

	function render(d) {
		var sig = d.sig || {}, cell = d.cell || {}, net = d.net || {}, sim = d.sim || {}, hw = d.modem || {};
		var reg = net.reg;
		var regTxt = reg === 1 || reg === 5 ? '<span class="md-tag ok">' + L.registered + '</span>'
			: reg === 2 ? '<span class="md-tag warn">' + L.searching + '</span>'
			: '<span class="md-tag err">' + L.unreg + '</span>';
		var act = {2: 'UMTS', 4: 'HSDPA', 5: 'HSUPA', 6: 'HSPA', 7: 'LTE'}[net.act] || net.sysmode || '-';

		var conn = row(L.operator, esc(net.operator || net.plmn)) +
			row(L.plmn, esc(net.plmn)) +
			row(L.mode, esc(act)) +
			row(L.reg, regTxt) +
			row(L.sim, esc(sim.state)) +
			row('PS', esc(net.ps)) +
			row('EMM', esc(net.emm)) +
			row(L.rrc, esc(net.rrc));

		var csq = sig.csq;
		var csqQ = csq == null ? null : qual(csq, [[20, L.excellent, '#4caf50'], [15, L.good, '#8bc34a'], [10, L.fair, '#ffc107'], [0, L.poor, '#f44336']]);
		var rsrpQ = sig.rsrp == null ? null : qual(sig.rsrp, [[-80, L.excellent, '#4caf50'], [-90, L.good, '#8bc34a'], [-100, L.fair, '#ffc107'], [-999, L.poor, '#f44336']]);
		var rsrqQ = sig.rsrq == null ? null : qual(sig.rsrq, [[-10, L.excellent, '#4caf50'], [-15, L.good, '#8bc34a'], [-20, L.fair, '#ffc107'], [-999, L.poor, '#f44336']]);
		var sinrQ = sig.sinr == null ? null : qual(sig.sinr, [[20, L.excellent, '#4caf50'], [13, L.good, '#8bc34a'], [0, L.fair, '#ffc107'], [-999, L.poor, '#f44336']]);

		var signals = bar(L.csq, csq, '/31', csq == null ? null : csq / 31 * 100, csqQ) +
			bar(L.rsrp, sig.rsrp, 'dBm', sig.rsrp == null ? null : clamp((sig.rsrp + 140) / 60 * 100, 0, 100), rsrpQ) +
			bar(L.rsrq, sig.rsrq, 'dB', sig.rsrq == null ? null : clamp((sig.rsrq + 20) / 20 * 100, 0, 100), rsrqQ) +
			bar(L.sinr, sig.sinr, 'dB', sig.sinr == null ? null : clamp((sig.sinr + 10) / 40 * 100, 0, 100), sinrQ) +
			bar(L.rssi, sig.rssi, 'dBm', sig.rssi == null ? null : clamp((sig.rssi + 120) / 60 * 100, 0, 100), null) +
			row(L.txpower, sig.txpower != null ? sig.txpower + ' dBm' : '-');

		var eci = cell.ci ? (parseInt(cell.ci, 16) + ' (' + cell.ci + ')') : null;
		var cells = row(L.band, esc(cell.band)) +
			row(L.bw, cell.bw ? cell.bw + ' MHz' : null) +
			row(L.pci, esc(cell.pci)) +
			row(L.earfcn, cell.earfcn_dl ? 'DL ' + cell.earfcn_dl + ' / UL ' + (cell.earfcn_ul || '-') : null) +
			row(L.tac, cell.tac ? parseInt(cell.tac, 16) + ' (' + cell.tac + ')' : null) +
			row(L.eci, esc(eci)) +
			row(L.plmn, cell.mcc ? cell.mcc + cell.mnc : null);
		arr(cell.scc).forEach(function(s) {
			cells += row(L.scc + s.n, esc(s.band) + (s.bw ? ' @' + s.bw + ' MHz' : ''));
		});

		var hwRows = row(L.model, esc((hw.manufacturer ? hw.manufacturer + ' ' : '') + (hw.model || ''))) +
			row(L.fw, esc(hw.revision)) +
			row(L.imei, esc(hw.imei)) +
			row(L.imsi, esc(hw.imsi)) +
			row(L.iccid, esc(hw.iccid)) +
			row(L.temp, sig.temp != null ? sig.temp + ' °C' : null) +
			row(L.uptime, fmtUptime(hw.uptime)) +
			row(L.resets, esc(hw.reset_count));

		document.getElementById('md-grid').innerHTML =
			card(L.conn, conn) + card(L.signal, signals) + card(L.cell, cells) +
			card(L.hardware, hwRows) + neighCard(d);
	}

	var timer = null;
	var inflight = false;

	function schedule(ms) {
		if (timer) { clearTimeout(timer); timer = null; }
		if (ms > 0) timer = setTimeout(tick, ms);
	}

	function tick() {
		if (inflight) return;
		inflight = true;
		var sel = document.getElementById('md-interval');
		var ms = parseInt(sel.value, 10) * 1000;
		fetch(URL, {credentials: 'same-origin', cache: 'no-store'})
			.then(function(r) { return r.json(); })
			.then(function(d) {
				render(d);
				document.getElementById('md-state').textContent = new Date().toLocaleTimeString();
			})
			.catch(function(e) {
				document.getElementById('md-state').textContent = L.offline;
			})
			.then(function() {
				inflight = false;
				schedule(ms);
			});
	}

	document.getElementById('md-interval').addEventListener('change', function() {
		schedule(parseInt(this.value, 10) * 1000);
	});
	document.getElementById('md-refresh').addEventListener('click', function() {
		if (!inflight) tick();
	});

	tick();
})();
</script>

<%+footer%>

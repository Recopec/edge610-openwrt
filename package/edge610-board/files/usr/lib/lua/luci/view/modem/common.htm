<style>
.md-toolbar{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.md-toolbar #md-state{margin-left:auto;font-variant-numeric:tabular-nums}
.md-muted{color:#98a2b3;font-size:.85rem}

/* Cards: real grid instead of CSS columns, so the cards line up and the empty
   space does not end up in the middle of a column. */
.md-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem;margin-top:.75rem;align-items:start}
@media(max-width:820px){.md-grid{grid-template-columns:minmax(0,1fr)}}
.md-full{margin-top:.75rem}
.md-card{background:#fff;border:1px solid #e6e8ee;border-radius:12px;box-shadow:0 1px 2px rgba(16,24,40,.04);overflow:hidden}
.md-card h3{margin:0;padding:.62rem .9rem;font-size:.74rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#667085;background:#fbfbfd;border-bottom:1px solid #eef0f5}
.md-card .md-body{padding:.3rem .9rem .55rem}

/* The theme stripes table rows and pads them; drop both and use hairlines. */
.md-table{width:100%;border-collapse:collapse;font-size:.86rem}
.md-card tr,.md-card td,.md-card th{background:transparent!important}
.md-table td{padding:.36rem 0;border-top:1px solid #f2f3f7;vertical-align:baseline}
.md-table tr:first-child td{border-top:0}
.md-l{color:#667085;white-space:nowrap;padding-right:.9rem;width:1%}
.md-v{text-align:right;color:#101828;font-weight:500;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.md-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.92em;letter-spacing:-.01em}

/* Bars: label left, value right, track below. */
.md-row{margin:.42rem 0}
.md-hd{display:flex;align-items:baseline;justify-content:space-between;gap:.6rem;font-size:.84rem}
.md-hd .md-hl{color:#667085}
.md-hd b{color:#101828;font-weight:500;font-variant-numeric:tabular-nums}
.md-bar{height:5px;background:#eef1f6;border-radius:3px;overflow:hidden;margin:.28rem 0 0}
.md-bar>span{display:block;height:100%;border-radius:3px;background:#4caf50}

.md-tag{display:inline-block;padding:.06rem .42rem;border-radius:6px;font-size:.74rem;font-weight:500;background:#eff4ff;color:#3538cd}
.md-tag.ok{background:#ecfdf3;color:#027a48}
.md-tag.warn{background:#fffaeb;color:#b54708}
.md-tag.err{background:#fef3f2;color:#b42318}

.md-neigh{font-size:.85rem}
.md-neigh th{font-size:.72rem;color:#98a2b3;font-weight:500;text-align:right;padding:0 0 .3rem;letter-spacing:.03em;border:0}
.md-neigh th:first-child{text-align:left}
.md-neigh td{text-align:right;padding:.28rem 0;font-variant-numeric:tabular-nums;border-top:1px solid #f2f3f7}
.md-neigh td:first-child{text-align:left;font-weight:500}
.md-neigh tr.md-serv td{background:#f2fbf5!important}
.md-neigh tr.md-serv td:first-child{box-shadow:inset 3px 0 0 #12b76a;padding-left:.45rem}
.md-neigh-wrap{display:flex;gap:1.4rem;flex-wrap:wrap}
.md-neigh-col{flex:1 1 340px;min-width:0}

.md-skel span{display:block;height:10px;border-radius:5px;background:#eceff3;margin:.6rem 0;animation:mdpulse 1.2s ease-in-out infinite}
.md-skel span:nth-child(odd){width:60%}
.md-skel span:nth-child(even){width:85%}
@keyframes mdpulse{0%,100%{opacity:.55}50%{opacity:1}}

.md-switchrow{display:flex;align-items:center;gap:.6rem;margin:.15rem 0 .35rem}
.md-switch{position:relative;display:inline-block;width:42px;height:22px;flex:0 0 auto}
.md-switch input{opacity:0;width:0;height:0}
.md-switch span{position:absolute;inset:0;background:#d0d5dd;border-radius:22px;cursor:pointer;transition:.2s}
.md-switch span:before{content:"";position:absolute;width:18px;height:18px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 2px rgba(16,24,40,.2)}
.md-switch input:checked + span{background:#12b76a}
.md-switch input:checked + span:before{transform:translateX(20px)}
</style>

<script>
function esc(s) {
	return String(s == null || s === '' ? '-' : s).replace(/[&<>"]/g, function(c) {
		return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c];
	});
}

function row(label, value, cls) {
	return '<tr><td class="md-l">' + label + '</td><td class="md-v ' + (cls || '') + '">' + value + '</td></tr>';
}

function body(id, rows) {
	var el = document.querySelector('#' + id + ' .md-body');
	if (el) el.innerHTML = '<table class="md-table">' + rows + '</table>';
}

function qual(v, levels) {
	if (v == null) return null;
	for (var i = 0; i < levels.length; i++) {
		if (v >= levels[i][0]) return levels[i];
	}
	return levels[levels.length - 1];
}

function bar(label, value, unit, pct, color) {
	color = color || '#4caf50';
	return '<div class="md-row"><div class="md-hd"><span class="md-hl">' + label + '</span><b>' +
		esc(value) + (value == null || !unit ? '' : ' ' + unit) + '</b></div>' +
		'<div class="md-bar"><span style="width:' + (pct == null ? 0 : Math.max(0, Math.min(100, pct))) +
		'%;background:' + color + '"></span></div></div>';
}

// First colour whose threshold the value reaches, darkest last.
function qcol(v, levels) {
	if (v == null) return null;
	for (var i = 0; i < levels.length; i++) {
		if (v >= levels[i][0]) return levels[i][1];
	}
	return levels[levels.length - 1][1];
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

// +CSQ rxqual index -> BER range (3GPP 27.007)
var BER = ['<0.2%', '0.2-0.4%', '0.4-0.8%', '0.8-1.6%', '1.6-3.2%', '3.2-6.4%', '6.4-12.8%', '>12.8%'];

var BW = {0: '1.4', 1: '3', 2: '5', 3: '10', 4: '15', 5: '20'};
function bwMHz(v) { return v == null ? '-' : (BW[v] != null ? BW[v] + ' MHz' : String(v)); }
function arr(v) { return Array.isArray(v) ? v : []; }

function fmtBytes(n) {
	if (n == null) return '-';
	var u = ['B', 'KB', 'MB', 'GB'], i = 0;
	while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
	return n.toFixed(i ? 1 : 0) + ' ' + u[i];
}

function fmtUptime(s) {
	if (s == null) return null;
	var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
	return (h > 0 ? h + 'h ' : '') + m + 'm';
}
</script>

<style>
/* Shared shell for the modem pages: cards, spec grids, tags, controls.
   Colours are the same neutral ramp the theme uses (grey 25…900). */
.md-muted{color:#98a2b3;font-size:.82rem}
/* Page bar: the refresh controls sit in one white strip so they do not float
   on the theme's header gradient. */
.md-toolbar{display:flex;align-items:center;gap:.45rem;flex-wrap:wrap;margin-bottom:.9rem;padding:.4rem .5rem .4rem .85rem;background:#fff;border:1px solid #eaecf0;border-radius:12px;box-shadow:0 1px 2px rgba(16,24,40,.05);font-size:.78rem;color:#475467}
.md-toolbar .md-muted{margin-right:auto;font-size:.74rem;color:#98a2b3;font-variant-numeric:tabular-nums}
.md-toolbar select,.md-toolbar .md-select{height:28px;padding:0 .4rem;font-size:.76rem;line-height:1;color:#475467;background:#fff;border:1px solid #e4e7ec;border-radius:8px;box-shadow:none}
.md-toolbar button,.md-toolbar .md-btn{height:28px;padding:0 .7rem;font-size:.76rem;font-weight:500;line-height:1;color:#344054;background:#fff;border:1px solid #e4e7ec;border-radius:8px;box-shadow:none;cursor:pointer}
.md-toolbar button:hover,.md-toolbar .md-btn:hover{background:#f9fafb}

.md-page{display:flex;flex-direction:column;gap:.9rem}
.md-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.9rem;align-items:start}
@media(max-width:900px){.md-cols{grid-template-columns:minmax(0,1fr)}}
.md-col{display:flex;flex-direction:column;gap:.9rem;min-width:0}
.md-mono,.md-cell.mono .md-v2{font-variant-numeric:tabular-nums;letter-spacing:.01em}

/* Cards: one surface, one hairline under the title, no row stripes. */
.md-card{background:#fff;border:1px solid #eaecf0;border-radius:14px;box-shadow:0 1px 2px rgba(16,24,40,.05);overflow:hidden}
.md-card h3{display:flex;align-items:center;justify-content:space-between;gap:.6rem;margin:0;padding:.8rem 1.1rem;font-size:.86rem;font-weight:600;line-height:1.3;color:#101828;background:none;border-bottom:1px solid #f2f4f7}
.md-card .md-body{padding:.15rem 1.1rem .7rem}
.md-card h3 .md-act{display:flex;align-items:center;gap:.5rem;font-weight:400;font-size:.8rem}

.md-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.9rem;align-items:start}
@media(max-width:880px){.md-grid{grid-template-columns:minmax(0,1fr)}}

/* Spec grid: label left, value right, two pairs per row, hairline between rows. */
.md-specs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:1.6rem;padding:.1rem 1.1rem .75rem}
@media(max-width:1080px){.md-specs{grid-template-columns:minmax(0,1fr)}}
.md-cell{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;padding:.42rem 0;border-top:1px solid #f2f4f7;min-width:0}
.md-cell:nth-child(-n+2){border-top:0}
.md-k2{font-size:.78rem;color:#667085;white-space:nowrap;flex:0 0 auto}
.md-v2{font-size:.82rem;font-weight:500;color:#101828;text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;min-width:0}

/* Legacy table rows, still used by the AT/SMS pages. */
.md-table{width:100%;border-collapse:collapse;font-size:.86rem}
.md-card tr,.md-card td,.md-card th{background:transparent!important}
.md-card .md-table>tbody>tr>td,.md-card .md-table>thead>tr>th,.md-card .md-table>tbody>tr>th{padding:.34rem 0;border-top:1px solid #f2f4f7;vertical-align:baseline;line-height:1.45}
.md-card .md-table>tbody>tr:first-child>td{border-top:0}
.md-table tr:first-child td{border-top:0}
.md-l{color:#667085;white-space:nowrap;padding-right:.9rem;width:1%}
.md-table .md-v{text-align:right;color:#101828;font-weight:500;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

/* Single metric row with a short track: label, track, value. */
.md-row{display:flex;align-items:center;gap:.55rem;font-size:.84rem;padding:.245rem 0;border-top:1px solid #f2f4f7}
.md-row:first-child{border-top:0}
.md-hl{flex:0 0 92px;white-space:nowrap;color:#667085}
.md-row b{flex:0 0 auto;order:3;margin-left:auto;color:#101828;font-weight:500;font-variant-numeric:tabular-nums}
.md-bar{flex:1 1 auto;max-width:190px;height:5px;background:#f2f4f7;border-radius:3px;overflow:hidden;order:2}
.md-bar>span{display:block;height:100%;border-radius:3px;background:#12b76a}

.md-tag{display:inline-block;padding:.1rem .45rem;border-radius:6px;font-size:.72rem;font-weight:500;line-height:1.35;background:#eff4ff;color:#3538cd}
.md-tag.ok{background:#ecfdf3;color:#067647}
.md-tag.warn{background:#fffaeb;color:#b54708}
.md-tag.err{background:#fef3f2;color:#b42318}
.md-tag.off{background:#f2f4f7;color:#667085}

.md-neigh{font-size:.85rem;width:100%;border-collapse:collapse}
.md-card .md-neigh>thead>tr>th{font-size:.7rem;color:#98a2b3;font-weight:500;text-align:right;padding:0 0 .3rem;border:0;letter-spacing:.02em}
.md-card .md-neigh>thead>tr>th:first-child{text-align:left}
.md-card .md-neigh>tbody>tr>td{text-align:right;padding:.3rem 0;font-variant-numeric:tabular-nums}
.md-card .md-neigh>tbody>tr>td:first-child{text-align:left;font-weight:500}
.md-neigh tr.md-serv td{background:#f6fef9!important}
.md-neigh tr.md-serv td:first-child{box-shadow:inset 2px 0 0 #12b76a;padding-left:.5rem}
.md-neigh-wrap{display:flex;gap:.4rem 1.8rem;flex-wrap:wrap}
.md-neigh-col{flex:1 1 480px;min-width:0}
.md-cap{font-size:.7rem;color:#98a2b3;margin:.45rem 0 .2rem}

.md-skel span{display:block;height:10px;border-radius:5px;background:#eef1f5;margin:.62rem 0;animation:mdpulse 1.2s ease-in-out infinite}
.md-skel span:nth-child(odd){width:58%}
.md-skel span:nth-child(even){width:88%}
.md-skel.md-specs span{width:88%}
@keyframes mdpulse{0%,100%{opacity:.5}50%{opacity:1}}

/* Buttons: one shape for every page. */
.md-btn{display:inline-flex;align-items:center;justify-content:center;gap:.3rem;height:30px;padding:0 .8rem;font-family:inherit;font-size:.8rem;font-weight:500;line-height:1;color:#344054;background:#fff;border:1px solid #e4e7ec;border-radius:8px;box-shadow:none;cursor:pointer;white-space:nowrap}
.md-btn:hover{background:#f9fafb;color:#101828}
.md-btn.md-accent{background:#5e72e4;border-color:#5e72e4;color:#fff}
.md-btn.md-accent:hover{background:#4c5fd0;color:#fff}
.md-btn.md-danger{color:#b42318;border-color:#fecdca}
.md-btn.md-danger:hover{background:#fef3f2}
.md-btn[disabled]{opacity:.55;cursor:default}
.md-btn.sm{height:26px;padding:0 .6rem;font-size:.74rem}

/* Form grid used by the settings page. */
.md-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem 1.2rem;padding:.9rem 1.1rem .2rem}
@media(max-width:700px){.md-form{grid-template-columns:minmax(0,1fr)}}
.md-sub{border-top:1px solid #f2f4f7;margin-top:.2rem;padding:.75rem 1.1rem .2rem}
.md-sub-t{font-size:.8rem;font-weight:600;color:#101828;margin-right:.4rem}
.md-sub .md-muted{font-size:.76rem;line-height:1.55}
.md-field{display:flex;flex-direction:column;gap:.28rem;min-width:0}
.md-field label{font-size:.74rem;color:#667085;margin:0;font-weight:400}
.md-field input,.md-field select{width:100%;height:32px;padding:0 .5rem;font-size:.82rem;line-height:1.2;color:#101828;background:#fff;border:1px solid #e4e7ec;border-radius:8px;box-shadow:none}
.md-field input:focus,.md-field select:focus{border-color:#5e72e4;outline:0;box-shadow:0 0 0 3px rgba(94,114,228,.12)}
.md-hint{font-size:.74rem;line-height:1.55;color:#98a2b3;margin:.55rem 1.1rem .8rem}
.md-body .md-hint{margin:.5rem 0 .2rem}

/* Band chips: the checkbox is invisible, the pill is the control. */
.md-chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:.4rem;padding:.9rem 1.1rem .1rem}
.md-body .md-chips{padding:.1rem 0 .2rem}
.md-chip{position:relative;display:block;margin:0;min-width:0}
.md-chip input{position:absolute;left:0;top:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.md-chip span{position:relative;display:block;padding:.34rem .4rem;border:1px solid #e4e7ec;border-radius:8px;background:#fff;font-size:.76rem;color:#475467;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.md-chip input:checked+span{background:#eef1ff;border-color:#9aa8ff;color:#3538cd;font-weight:500}
.md-chip input:focus-visible+span{box-shadow:0 0 0 3px rgba(94,114,228,.18)}
.md-chip.md-cur span{border-color:#12b76a;box-shadow:inset 0 0 0 1px #12b76a;padding-right:1rem}
.md-chip.md-cur span:after{content:"";position:absolute;top:.42rem;right:.34rem;width:6px;height:6px;border-radius:50%;background:#12b76a}

.md-actions-row{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;padding:.6rem 1.1rem .9rem}
.md-body .md-actions-row{padding:0 0 .6rem}
.md-actions-row .md-hint{margin:0}
.md-actions-row.md-end{justify-content:flex-end;padding:.3rem 0 0}

.md-notice{margin-bottom:.9rem;padding:.6rem .85rem;border:1px solid #d1fadf;border-radius:10px;background:#ecfdf3;color:#067647;font-size:.82rem;line-height:1.5}

.md-switch{position:relative;display:inline-block;width:38px;height:20px;flex:0 0 auto}
.md-switch input{opacity:0;width:0;height:0}
.md-switch span{position:absolute;inset:0;background:#d0d5dd;border-radius:20px;cursor:pointer;transition:.18s}
.md-switch span:before{content:"";position:absolute;width:16px;height:16px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.18s;box-shadow:0 1px 2px rgba(16,24,40,.2)}
.md-switch input:checked + span{background:#12b76a}
.md-switch input:checked + span:before{transform:translateX(18px)}
</style>

<script>
function esc(s) {
	return String(s == null || s === '' ? '-' : s).replace(/[&<>"]/g, function(c) {
		return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c];
	});
}

function row(label, value, cls) {
	return '<tr><td class="md-l">' + label + '</td><td class="md-v ' + (cls || '') + '">' + value + '</td></tr>';
}

// Accepts both <div class="md-card" id="x"><div class="md-body">… and
// <div class="md-card"><div class="md-body" id="x">.
function html(id, markup) {
	var el = document.getElementById(id) || document.querySelector('#' + id + ' .md-body');
	if (!el) return;
	if (!/\bmd-body\b/.test(el.className)) el = el.querySelector('.md-body');
	if (el) el.innerHTML = markup;
}

function body(id, rows) {
	html(id, '<table class="md-table">' + rows + '</table>');
}

function qual(v, levels) {
	if (v == null) return null;
	for (var i = 0; i < levels.length; i++) {
		if (v >= levels[i][0]) return levels[i];
	}
	return levels[levels.length - 1];
}

function bar(label, value, unit, pct, color) {
	color = color || '#12b76a';
	return '<div class="md-row"><span class="md-hl">' + label + '</span>' +
		'<span class="md-bar"><span style="width:' + (pct == null ? 0 : Math.max(0, Math.min(100, pct))) +
		'%;background:' + color + '"></span></span>' +
		'<b>' + esc(value) + (value == null || !unit ? '' : ' ' + unit) + '</b></div>';
}

// First colour whose threshold the value reaches, darkest last.
function qcol(v, levels) {
	if (v == null) return null;
	for (var i = 0; i < levels.length; i++) {
		if (v >= levels[i][0]) return levels[i][1];
	}
	return levels[levels.length - 1][1];
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

// +CSQ rxqual index -> BER range (3GPP 27.007)
var BER = ['<0.2%', '0.2-0.4%', '0.4-0.8%', '0.8-1.6%', '1.6-3.2%', '3.2-6.4%', '6.4-12.8%', '>12.8%'];

var BW = {0: '1.4', 1: '3', 2: '5', 3: '10', 4: '15', 5: '20'};
// AT!GSTATUS reports the real width in MHz on this firmware; older images
// reported the 0-5 index, so accept both.
function bwMHz(v) {
	if (v == null) return '-';
	if (v > 5) return v + ' MHz';
	return BW[v] != null ? BW[v] + ' MHz' : String(v);
}
function arr(v) { return Array.isArray(v) ? v : []; }

function fmtBytes(n) {
	if (n == null) return '-';
	var u = ['B', 'KB', 'MB', 'GB'], i = 0;
	while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
	return n.toFixed(i ? 1 : 0) + ' ' + u[i];
}

function fmtUptime(s) {
	if (s == null) return null;
	var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
	return (h > 0 ? h + 'h ' : '') + m + 'm';
}
</script>
